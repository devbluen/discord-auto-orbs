# Builds the Windows installer and Linux archive, then publishes both.
# Manual only: run it from the Actions tab ("Release" → "Run workflow").
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.0.0)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The Wine dummy is Linux-only and never committed: it is compiled here from
  # src/dummy-game-win.c and goes only into the Linux archive.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tag becomes the version the update check compares against.
      - run: npm pkg set version="${VERSION#v}"
        env:
          VERSION: ${{ inputs.version }}
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: npm run build:dummy
      - run: npm run check
      # Versioned file and folder names, so several downloads/extractions don't overwrite each other.
      - name: Package Linux release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION#v}"
          mkdir -p dist
          tar -czf "dist/discord-orbs-linux-$v.tar.gz" --transform="s,^,discord-auto-quest-$v/," \
            README.md README.pt-BR.md package.json package-lock.json src scripts
          tar -xOf "dist/discord-orbs-linux-$v.tar.gz" "discord-auto-quest-$v/src/dummy-game-win.exe" | cmp - src/dummy-game-win.exe

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/discord-orbs-linux-*.tar.gz

  release:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm pkg set "version=$($env:VERSION -replace '^v', '')"
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
      - run: npm run check
      - run: npm run build

      - name: Version the exe name
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $v = $env:VERSION -replace '^v', ''
          Move-Item dist/discord-orbs.exe "dist/discord-orbs-$v.exe"
          "ASSET_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist

      - name: Checksum
        shell: pwsh
        run: |
          foreach ($file in @("discord-orbs-$env:ASSET_VERSION.exe", "discord-orbs-linux-$env:ASSET_VERSION.tar.gz")) {
            $hash = (Get-FileHash "dist/$file" -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -Encoding ascii "dist/$file.sha256"
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $v = $env:ASSET_VERSION
          $notes = @"
          **Windows:** Download ``discord-orbs-$v.exe``, open it and choose 1 (Install).

          **Linux:** Download ``discord-orbs-linux-$v.tar.gz``, extract it, then run ``node src/cli.cjs install`` inside the extracted ``discord-auto-quest-$v`` folder.

          Windows may show a SmartScreen warning because the exe is unsigned: click "More info" → "Run anyway". / O Windows pode mostrar um aviso do SmartScreen porque o exe não é assinado: clique em "Mais informações" → "Executar assim mesmo".

          SHA-256 checksums are included for both downloads.
          "@
          $flags = @()
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create $env:VERSION "dist/discord-orbs-$v.exe" "dist/discord-orbs-$v.exe.sha256" `
            "dist/discord-orbs-linux-$v.tar.gz" "dist/discord-orbs-linux-$v.tar.gz.sha256" `
            --target $env:GITHUB_SHA --title $env:VERSION --notes $notes --generate-notes @flags
